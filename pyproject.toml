[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-intelligence-platform"
version = "0.1.0"
description = "Profile Intelligence Platform (PIP) — local-first desktop profile analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Profile Intelligence Platform Contributors" },
]
keywords = [
    "profile",
    "intelligence",
    "desktop",
    "sqlite",
    "excel",
    "local-first",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0.2",
    "SQLAlchemy>=2.0.36",
    "openpyxl>=3.1.5",
    "Pillow>=11.0.0",
    "beautifulsoup4>=4.12.3",
    "typing-extensions>=4.12.2",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2.0",
]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "mypy>=1.14.0",
    "ruff>=0.8.4",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
pip-app = "profile_intelligence.main:main"

[project.urls]
Homepage = "https://github.com/Icarus-666-play/profile-intelligence-platform"
Documentation = "https://github.com/Icarus-666-play/profile-intelligence-platform/tree/main/docs"
Repository = "https://github.com/Icarus-666-play/profile-intelligence-platform"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
profile_intelligence = ["py.typed", "ui/static/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "tests.py"]
pythonpath = ["src", "plugins"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
branch = true
source = ["profile_intelligence"]
omit = [
    "*/tests.py",
    "*/conftest.py",
    "*/test_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"
packages = ["profile_intelligence"]

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bs4.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # type annotations
    "S",    # bandit
    "BLE",  # blind except
    "C4",   # comprehensions
    "DTZ",  # datetimez
    "T20",  # flake8-print
    "RUF",  # ruff
]
ignore = [
    "S101",  # assert in tests is fine; also used sparingly in core
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "T201"]
"plugins/**/tests.py" = ["S101", "ANN", "T201", "E501"]
"plugins/**/conftest.py" = ["S101", "ANN", "T201"]
"scripts/**/*.py" = ["T201", "E402"]
"src/profile_intelligence/main.py" = ["T201"]
"src/profile_intelligence/ui/**" = ["E501", "T201"]
"src/profile_intelligence/api/routes.py" = ["S310"]
"src/profile_intelligence/infrastructure/download/**" = ["S310"]

[tool.ruff.lint.isort]
known-first-party = ["profile_intelligence"]
